[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nneeg"
version = "0.1.0"
description = "Automated dataset fingerprinting, rule-based config, and deterministic alignment for frozen EEG foundation models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Samer Zumot", email = "54731842+samerzumot@users.noreply.github.com"}
]
dependencies = [
    "torch>=2.2",
    "mne>=1.6",
    "scipy>=1.10",
    "pyriemann>=0.5",
    "scikit-learn>=1.3",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.scripts]
nneeg = "nneeg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
